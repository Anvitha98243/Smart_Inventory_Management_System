<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – Inventra</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-bg">
  <div class="auth-card">
    <div class="logo">
      <div class="logo-icon">🔒</div>
      <h1>Reset Password</h1>
      <p class="subtitle">Enter your reset token and new password</p>
    </div>
    <div id="alertBox" class="hidden"></div>
    <form id="rpForm">
      <div class="form-group">
        <label>Reset Token</label>
        <input type="text" id="token" class="form-control" placeholder="Paste your reset token" required>
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="rpBtn">Reset Password</button>
    </form>
    <div class="text-center mt-4">
      <a href="/login.html" class="auth-link">← Back to Login</a>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
// Pre-fill token from URL
const params = new URLSearchParams(window.location.search);
if (params.get('token')) document.getElementById('token').value = params.get('token');

document.getElementById('rpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('rpBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Resetting...';
    const res = await apiCall('POST', '/auth/reset-password', {
        token: document.getElementById('token').value.trim(),
        newPassword: document.getElementById('password').value
    });
    btn.disabled = false; btn.innerHTML = 'Reset Password';
    const box = document.getElementById('alertBox');
    if (!res) return;
    box.className = res.success ? 'alert alert-success' : 'alert alert-danger';
    box.textContent = res.message;
    box.classList.remove('hidden');
    if (res.success) setTimeout(() => window.location.href = '/login.html', 2000);
});
</script>
</body>
</html>
