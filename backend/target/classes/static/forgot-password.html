<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password – Inventra</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-bg">
  <div class="auth-card">
    <div class="logo">
      <div class="logo-icon">🔑</div>
      <h1>Forgot Password</h1>
      <p class="subtitle">Enter your email to receive a reset token</p>
    </div>
    <div id="alertBox" class="hidden"></div>
    <form id="fpForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="your@email.com" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="fpBtn">Send Reset Token</button>
    </form>
    <div class="text-center mt-4">
      <a href="/login.html" class="auth-link">← Back to Login</a>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
document.getElementById('fpForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('fpBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Sending...';
    const res = await apiCall('POST', '/auth/forgot-password', { email: document.getElementById('email').value.trim() });
    btn.disabled = false; btn.innerHTML = 'Send Reset Token';
    const box = document.getElementById('alertBox');
    if (!res) return;
    box.className = res.success ? 'alert alert-success' : 'alert alert-danger';
    box.textContent = res.message;
    box.classList.remove('hidden');
});
</script>
</body>
</html>
