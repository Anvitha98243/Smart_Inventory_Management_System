<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register – Inventra</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-bg">
  <div class="auth-card" style="max-width:520px">
    <div class="logo">
      <div class="logo-icon">📦</div>
      <h1>Create Account</h1>
      <p class="subtitle">Join Inventra – Smart Inventory Management</p>
    </div>
    <div id="alertBox" class="hidden"></div>
    <form id="registerForm">
      <div class="grid-2">
        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="form-control" placeholder="johndoe" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label>Role</label>
          <select id="role" class="form-control" onchange="toggleAdminField(this.value)">
            <option value="ADMIN">Admin</option>
            <option value="STAFF">Staff</option>
          </select>
        </div>
      </div>
      <div class="form-group hidden" id="adminUsernameGroup">
        <label>Admin Username <span style="color:var(--danger)">*</span></label>
        <input type="text" id="adminUsername" class="form-control" placeholder="Enter your admin's username">
        <small style="color:var(--gray-600);font-size:12px">Staff members must link to an existing admin account</small>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Create Account</button>
    </form>
    <div class="text-center mt-4">
      Already have an account? <a href="/login.html" class="auth-link">Sign In</a>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
function toggleAdminField(role) {
    const grp = document.getElementById('adminUsernameGroup');
    const input = document.getElementById('adminUsername');
    if (role === 'STAFF') { grp.classList.remove('hidden'); input.required = true; }
    else { grp.classList.add('hidden'); input.required = false; }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('registerBtn');
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Creating...';

    const body = {
        fullName: document.getElementById('fullName').value.trim(),
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        role: document.getElementById('role').value
    };
    const adminU = document.getElementById('adminUsername').value.trim();
    if (adminU) body.adminUsername = adminU;

    const res = await apiCall('POST', '/auth/register', body);
    btn.disabled = false; btn.innerHTML = 'Create Account';

    const box = document.getElementById('alertBox');
    if (!res) return;

    if (res.success) {
        box.className = 'alert alert-success';
        box.textContent = '✅ Account created! Redirecting to login...';
        box.classList.remove('hidden');
        setTimeout(() => window.location.href = '/login.html', 2000);
    } else {
        box.className = 'alert alert-danger';
        box.textContent = res.message;
        box.classList.remove('hidden');
    }
});
</script>
</body>
</html>
