<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – Inventra</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-bg">
  <div class="auth-card">
    <div class="logo">
      <div class="logo-icon">📦</div>
      <h1>Inventra</h1>
      <p class="subtitle">Smart Inventory Management</p>
    </div>
    <div id="alertBox" class="hidden"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
        Sign In
      </button>
    </form>
    <div class="text-center mt-4">
      <a href="/forgot-password.html" class="auth-link">Forgot password?</a>
    </div>
    <div class="text-center mt-3">
      Don't have an account? <a href="/register.html" class="auth-link">Register</a>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
// Already logged in?
if (getToken()) {
    const u = getUser();
    window.location.href = u.role === 'ADMIN' ? '/pages/admin-dashboard.html' : '/pages/staff-dashboard.html';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';

    const res = await apiCall('POST', '/auth/login', {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
    });

    btn.disabled = false;
    btn.innerHTML = 'Sign In';

    if (!res) return;

    if (res.success) {
        const data = res.data;
        setAuth(data.token, { username: data.username, role: data.role, fullName: data.fullName, userId: data.userId });
        const redirect = data.role === 'ADMIN' ? '/pages/admin-dashboard.html' : '/pages/staff-dashboard.html';
        window.location.href = redirect;
    } else {
        const box = document.getElementById('alertBox');
        box.className = 'alert alert-danger';
        box.textContent = res.message;
        box.classList.remove('hidden');
    }
});
</script>
</body>
</html>
